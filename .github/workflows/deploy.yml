name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"  # daily, so new map-challenge days appear without a push here

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout map challenge
        uses: actions/checkout@v4
        with:
          repository: alittlesliceoftom/map-challenge-2026
          path: map-challenge
      - name: Build map challenge into /projects/map-challenge-2026
        run: |
          pip install -r map-challenge/requirements-site.txt
          cd map-challenge && python build.py && cd ..
          mkdir -p public/projects/map-challenge-2026
          cp -r map-challenge/site/. public/projects/map-challenge-2026/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
